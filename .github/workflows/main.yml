name: Build Fugu15 Rootful

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: fugu15-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build open-source CryptexManager
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a build.log) 2>&1
          brew list libimobiledevice >/dev/null 2>&1 || brew install libimobiledevice
          git clone --depth 1 https://github.com/pinauten/CryptexManager.git "$RUNNER_TEMP/CryptexManager"
          cd "$RUNNER_TEMP/CryptexManager"
          swift package resolve
          PLIST_WRAPPER=".build/checkouts/Swift_libimobiledevice/Sources/Swift_libimobiledevice/plist.swift"
          if [[ ! -f "$PLIST_WRAPPER" ]]; then
            echo "Could not find the Swift_libimobiledevice plist wrapper." >&2
            exit 1
          fi
          # libplist 2.3 replaced the two format-specific free functions
          # with plist_mem_free. The archived Swift wrapper predates that API.
          sed -i '' \
            -e 's/plist_to_xml_free(/plist_mem_free(/g' \
            -e 's/plist_to_bin_free(/plist_mem_free(/g' \
            "$PLIST_WRAPPER"
          grep -n 'plist_mem_free' "$PLIST_WRAPPER"
          swift build -c release \
            -Xlinker "-L$(brew --prefix)/lib" \
            -Xcc "-I$(brew --prefix)/include"
          mkdir -p "$RUNNER_TEMP/fugu-tools"
          cp .build/release/CryptexManager "$RUNNER_TEMP/fugu-tools/CryptexManager"
          chmod +x "$RUNNER_TEMP/fugu-tools/CryptexManager"
          echo "$RUNNER_TEMP/fugu-tools" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/fugu-tools/CryptexManager" 2>&1 | head -n 20 || true

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
            bootstrapFS/.build/repositories
            FuFuGuGu/.build/repositories
            MachOMerger/.build/repositories
            stashd/.build/repositories
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Build all payload components
        shell: bash
        run: |
          set -o pipefail
          make tipa 2>&1 | tee -a build.log

      - name: Package artifacts
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp Fugu15.tipa dist/Fugu15_Rootful-unsigned.tipa
          cp Fugu15/Fugu15.ipa dist/Fugu15_Rootful-unsigned.ipa
          shasum -a 256 dist/* | tee dist/SHA256SUMS.txt

      - name: Upload IPA and TIPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fugu15-Rootful-iPhone11Pro-iOS15.1
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Fugu15-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7
